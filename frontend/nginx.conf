server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # SPA — wszystkie nieznane ścieżki obsługuje React Router (index.html).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statyczne zasoby buildu — długi cache (nazwy plików są hashowane przez Vite).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy REST API do serwisu backendu (te same prefiksy co proxy Vite w dev).
    # Dzięki temu frontend i API są w tym samym origin — bez potrzeby CORS.
    location ~ ^/(predict|explain|chat|agent|config|model|models|health|docs|redoc|openapi\.json) {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Wyjaśnienia XAI i predykcje wsadowe potrafią liczyć się dłużej.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
